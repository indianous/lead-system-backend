spring.application.name=lead-system

server.port=${SERVER_PORT:8090}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/lead_system}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Segredo de assinatura do JWT. O default abaixo é só para desenvolvimento local
# (mesmo padrão de DATABASE_PASSWORD acima) — em produção, JWT_SECRET é obrigatório.
app.security.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-signing-secret-change-in-production-0123456789}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Credenciais do primeiro usuário administrador, seedadas pela migration V4 (SeedInitialAdminUserMigration).
# Default abaixo é só para desenvolvimento local; em produção, defina ADMIN_INITIAL_EMAIL/PASSWORD.
app.security.initial-admin.email=${ADMIN_INITIAL_EMAIL:admin@leadsystem.local}
app.security.initial-admin.password=${ADMIN_INITIAL_PASSWORD:ChangeMe123!}

# Origens do frontend autorizadas a chamar a API pelo navegador (CORS), separadas por vírgula.
# Default cobre o dev local e o teste em outra máquina via Tailscale; em produção, defina
# CORS_ALLOWED_ORIGINS com a(s) origem(ns) real(is).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://100.64.251.52:3001}

# Endpoint público de recepção de leads do site (POST /api/public/leads). Chamador é o backend do
# site institucional (fora do escopo deste projeto) — nunca um navegador, já que a chave é secreta.
# Default abaixo é só para desenvolvimento local; em produção, defina PUBLIC_LEADS_API_KEY.
app.public-api.key=${PUBLIC_LEADS_API_KEY:dev-only-public-leads-api-key-change-in-production}
# Usuário para quem leads anônimos do site são atribuídos por padrão, para triagem manual —
# reatribuídos depois via PUT /api/leads/{id}.
app.public-api.default-assignee-email=${PUBLIC_LEADS_DEFAULT_ASSIGNEE_EMAIL:admin@leadsystem.local}
# Rate limiting (Bucket4j) por IP de origem: capacity requisições, reabastecendo refill-tokens a
# cada refill-duration-seconds. Default: 20 submissões por minuto por IP.
app.public-api.rate-limit.capacity=${PUBLIC_API_RATE_LIMIT_CAPACITY:20}
app.public-api.rate-limit.refill-tokens=${PUBLIC_API_RATE_LIMIT_REFILL_TOKENS:20}
app.public-api.rate-limit.refill-duration-seconds=${PUBLIC_API_RATE_LIMIT_REFILL_SECONDS:60}

# Qualificação automática (Etapa 7) — regra inicial simples, sujeita a recalibração com dados
# reais de conversão (ver estudo de caso, seção "Riscos"). Orçamento declarado igual ou acima
# deste valor conta como sinal forte; abaixo disso conta como sinal fraco (mas presente).
app.qualification.budget-threshold-cents=${QUALIFICATION_BUDGET_THRESHOLD_CENTS:200000}
# Palavras-chave (separadas por vírgula, sem acento/caixa) que, se presentes em desired_timeline
# (campo de texto livre), contam como sinal de urgência forte.
app.qualification.urgent-keywords=${QUALIFICATION_URGENT_KEYWORDS:imediato,urgente,hoje,esta semana,essa semana,amanha}

# Central de mensagens (Etapa 8) — credenciais reais ainda não confirmadas (ver plano da etapa);
# defaults abaixo são só-dev/vazios, produção exige valores reais das variáveis de ambiente.
app.messaging.whatsapp.api-base-url=${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v20.0}
app.messaging.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.messaging.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.messaging.whatsapp.app-secret=${WHATSAPP_APP_SECRET:dev-only-insecure-whatsapp-app-secret}
# Token que você mesmo escolhe e cadastra na tela de configuração do webhook da Meta — usado só
# no desafio de verificação inicial (GET /api/webhooks/whatsapp).
app.messaging.whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:dev-only-whatsapp-verify-token}

app.messaging.telegram.api-base-url=${TELEGRAM_API_BASE_URL:https://api.telegram.org}
app.messaging.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
# Username do bot (sem @), usado para montar o deep link t.me/<bot-username>?start=<leadId> que
# resolve a conversa nova do Telegram (ver plano da Etapa 8 — o chat_id só existe depois que o
# lead manda a primeira mensagem ao bot).
app.messaging.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
# Token que você mesmo escolhe e passa no setWebhook — o Telegram ecoa esse valor no header
# X-Telegram-Bot-Api-Secret-Token de toda chamada de webhook, para verificação.
app.messaging.telegram.webhook-secret-token=${TELEGRAM_WEBHOOK_SECRET_TOKEN:dev-only-telegram-webhook-secret}
